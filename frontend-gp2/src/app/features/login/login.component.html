<section class="site-width page-section">
  <div class="panel auth-panel">
    <h1 class="page-title">Iniciar sesión</h1>
    <p class="text-soft">{{ registered ? 'Tu cuenta ya está lista. Ingresa para continuar.' :
      'Ingresa para hacer tus pedidos y consultar su estado.' }}</p>
    <form #login="ngForm" (ngSubmit)="login.valid && submit()">
      <div class="field">
        <label for="login-user">Usuario</label>
        <input id="login-user" name="username" autocomplete="username" [(ngModel)]="username" required maxlength="255">
      </div>
      <div class="field">
        <label for="login-password">Contraseña</label>
        <div class="password-input">
          <input id="login-password" name="password" [type]="visible() ? 'text' : 'password'"
            autocomplete="current-password" [(ngModel)]="password" required maxlength="255">
          <button type="button" (click)="visible.set(!visible())">{{ visible() ? 'Ocultar' : 'Mostrar' }}</button>
        </div>
      </div>
      @if (error()) { <p class="app-alert" role="alert">{{ error() }}</p> }
      <button class="action primary" type="submit" [disabled]="pending() || login.invalid">
        {{ pending() ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>
    <p class="auth-foot">¿Aún no tienes cuenta? <a routerLink="/registro" [queryParams]="{ volver: returnPath }">Crear cuenta</a></p>
  </div>
</section>
