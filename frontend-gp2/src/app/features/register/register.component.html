<div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg">

            <div class="modal-header bg-upeu-primary text-white">
                <h5 class="modal-title">Crear Cuenta Nueva</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                    id="closeRegisterModal"></button>
            </div>

            <div class="modal-body p-4">
                <form (ngSubmit)="registrar()" #regForm="ngForm">
                    <div class="row">
                        <!-- Datos Personales -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" [(ngModel)]="userData.nombre" name="nombre"
                                required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" [(ngModel)]="userData.email" name="email" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Teléfono (9 dígitos)</label>
                            <input type="text" class="form-control" [(ngModel)]="userData.telefono" name="telefono"
                                pattern="9\d{8}" required #tel="ngModel">
                            @if (tel.invalid && tel.touched) {
                            <small class="text-danger">Debe empezar con 9 y tener 9 dígitos</small>
                            }
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Dirección</label>
                            <input type="text" class="form-control" [(ngModel)]="userData.direccion" name="direccion">
                        </div>

                        <hr class="my-3">

                        <!-- Credenciales -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Nombre de Usuario</label>
                            <input type="text" class="form-control" [(ngModel)]="userData.usuario" name="usuario"
                                required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" [(ngModel)]="userData.password" name="password"
                                required minlength="6">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mt-3"
                        [disabled]="regForm.invalid || isloading">
                        {{ isloading ? 'Procesando...' : 'Registrarme ahora' }}
                    </button>
                </form>
            </div>

            <!-- ... dentro del modal-footer del registro ... -->
            <div class="modal-footer justify-content-center border-0">
                <p class="text-muted small">
                    ¿Ya tienes cuenta?
                    <a href="javascript:void(0)" class="text-upeu-primary fw-bold" data-bs-toggle="modal"
                        data-bs-target="#loginModal">
                        Inicia sesión aquí
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
