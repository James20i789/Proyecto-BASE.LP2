<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-upeu-primary text-white">
      <h4>{{ id ? 'Editar' : 'Nuevo' }} Producto</h4> 
    </div>
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="guardar()">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" formControlName="nombre" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <textarea formControlName="descripcion" class="form-control"></textarea>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Precio</label>
            <input type="number" formControlName="precio" class="form-control"> 
            <label class="form-label">Stock</label>
            <input type="number" formControlName="stock" class="form-control">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Imagen</label>
          <input type="file" (change)="onFileSelected($event)" class="form-control" accept="image/*">
        </div>

        <div class="mt-4">
          <button type="submit" class="btn btn-primary me-2" [disabled]="form.invalid">Guardar</button>
          <a routerLink="/productos" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
