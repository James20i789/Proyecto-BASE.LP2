<section class="site-width page-section">
  <div class="panel auth-panel wide">
    <h1 class="page-title">{{ id ? 'Editar producto' : 'Nuevo producto' }}</h1>
    @if (loadError()) {
      <p class="app-alert" role="alert">{{ loadError() }}</p>
      <a class="action secondary" routerLink="/productos">Volver a productos</a>
    } @else {
      <form [formGroup]="form" (ngSubmit)="guardar()">
        <div class="field">
          <label for="product-name">Nombre</label>
          <input id="product-name" formControlName="nombre" maxlength="240">
        </div>
        <div class="field">
          <label for="product-description">Descripción</label>
          <textarea id="product-description" formControlName="descripcion" maxlength="255" rows="3"></textarea>
        </div>
        <div class="auth-fields">
          <div class="field">
            <label for="product-price">Precio en soles</label>
            <input id="product-price" type="number" min="0.01" step="0.01" formControlName="precio">
          </div>
          <div class="field">
            <label for="product-stock">Stock</label>
            <input id="product-stock" type="number" min="0" step="1" formControlName="stock">
          </div>
        </div>
        <div class="field">
          <label for="product-photo">Imagen</label>
          <input id="product-photo" type="file" (change)="onFileSelected($event)" accept="image/jpeg,image/png">
        </div>
        @if (error()) { <p class="app-alert" role="alert">{{ error() }}</p> }
        <div class="form-actions">
          <button class="action primary" type="submit" [disabled]="busy() || form.invalid">{{ busy() ? 'Guardando…' : 'Guardar' }}</button>
          <a routerLink="/productos" class="action secondary">Cancelar</a>
        </div>
      </form>
    }
  </div>
</section>
