<div class = "container mt-4">
    <h2 class = "text-upeu-primary mb-4"> NUESTRO CATALOGO DE PRODUCTOS</h2>
    <div class="row">
        @for(prod of productos; track prod.id){
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm">
                <img [src]="prod.imagen" class="card-img-top" alt="{{prod.nombre}}"
                style="height: 200px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title">{{prod.nombre}}</h5>
                    <p class="card-text text-muted">{{prod.descripcion}}</p>
                    <h4 class="text-upeu-primary">Precio: S/.{{prod.precio}}</h4>
                    <button class="btn btn-outline-accent w-100">Agregar al Carrito</button>
                </div>
            </div>

        </div>
        }
    </div>
</div>
