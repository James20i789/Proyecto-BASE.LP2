<header class="site-header">
  <div class="site-width header-inner">
    <a class="brand" routerLink="/home" aria-label="Cocina UPeU, inicio">
      <span class="brand-mark"><i class="bi bi-fire" aria-hidden="true"></i></span>
      <span>Cocina <strong>UPeU</strong></span>
    </a>
    <nav class="main-nav" aria-label="Navegación principal">
      <a routerLink="/home" routerLinkActive="active">Carta</a>
      @if (auth.user()?.rol === 'CLIENTE') {
        <a routerLink="/pedidos" routerLinkActive="active">Mis pedidos</a>
      }
      @if (auth.user()?.rol === 'ADMIN') {
        <a routerLink="/productos" routerLinkActive="active">Gestionar productos</a>
      }
    </nav>
    <div class="header-actions">
      @if (auth.user(); as account) {
        <span class="header-user">{{ account.usuario }}</span>
        <button class="account-action" type="button" (click)="logout()" [disabled]="signingOut()">
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i> <span>Salir</span>
        </button>
      } @else {
        <a class="account-action" routerLink="/login"><i class="bi bi-person" aria-hidden="true"></i> <span>Ingresar</span></a>
      }
      <a class="cart-link" routerLink="/carrito" [attr.aria-label]="'Carrito, ' + cart.totalItems() + ' unidades'">
        <i class="bi bi-bag" aria-hidden="true"></i>
        <span>{{ cart.totalItems() }}</span>
      </a>
    </div>
  </div>
</header>
