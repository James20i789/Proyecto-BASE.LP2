spring:
  application:
    name: lp2_gp2
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XE}
    username: ${DB_USERNAME:LP2_GP2}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}

server:
  port: ${API_PORT:8082}
  servlet:
    context-path: /lp2_gp2
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: LP2SESSION
        path: /
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

storage:
  location: ${STORAGE_LOCATION:images}

payment:
  mercado-pago:
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
    collector-id: ${MERCADO_PAGO_COLLECTOR_ID:}
    public-url: ${APP_PUBLIC_URL:}
